version: '3'

services:
  neo4j:
    image: neo4j:5.13.0
    container_name: neo4j-knowledge-graph
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password  # Default credentials (change in production)
      - NEO4J_PLUGINS=["apoc"]     # Include APOC plugin for advanced operations
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - graph-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-graph-frontend
    depends_on:
      - neo4j
    ports:
      - "8501:8501"  # Streamlit web interface
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./data:/app/data
    networks:
      - graph-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501"]
      interval: 20s
      timeout: 10s
      retries: 3

networks:
  graph-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import: 