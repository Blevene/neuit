[pytest]
# Pytest configuration for NEUIToolkit

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    neo4j: Tests requiring Neo4j database
    llm: Tests requiring LLM API

# Coverage options (when running with pytest-cov)
[coverage:run]
source = backend,llm
omit =
    */tests/*
    */prototype/*
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
